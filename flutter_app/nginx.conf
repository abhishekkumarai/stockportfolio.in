server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Path URLs (usePathUrlStrategy): every unknown path is a client route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The entry points must never be cached, or a deploy keeps serving old code.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
  location = /main.dart.js { add_header Cache-Control "no-cache"; }
}
