# Alembic configuration.
#
# The database URL is deliberately absent: it is read from DATABASE_URL in
# migrations/env.py so that the same file works locally, on Render, and in
# CI without anyone editing a connection string into version control.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# UTC, and a date prefix so `ls` orders revisions the way they were written.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
